<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOSAIC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0a0a0f;
    --panel: #111118;
    --border: #2a2a3a;
    --accent: #ff3c5f;
    --accent2: #00e5ff;
    --text: #e8e8f0;
    --muted: #555570;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 60px;
    overflow-x: hidden;
  }

  header {
    width: 100%;
    padding: 28px 40px 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0;
    width: 160px; height: 2px;
    background: var(--accent);
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.2rem;
    letter-spacing: 0.12em;
    color: var(--text);
    line-height: 1;
  }
  .tag {
    font-size: 0.65rem;
    color: var(--accent2);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: 1px solid var(--accent2);
    padding: 3px 8px;
    opacity: 0.8;
  }

  .workspace {
    width: 100%;
    max-width: 1100px;
    padding: 40px 24px 0;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px;
  }

  .card-label {
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .drop-zone {
    border: 2px dashed var(--border);
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(255,60,95,0.04);
  }
  .drop-zone .icon { font-size: 2rem; margin-bottom: 10px; display: block; opacity: 0.5; }
  .drop-zone p { font-size: 0.7rem; color: var(--muted); line-height: 1.7; }
  .drop-zone strong { color: var(--accent); }
  #fileInput { display: none; }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
  }
  .slider-header span:first-child { color: var(--muted); letter-spacing: 0.05em; }
  .slider-val { color: var(--accent2); font-weight: 700; min-width: 40px; text-align: right; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 0;
    cursor: pointer;
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  /* 색상 비트 프리셋 버튼 */
  .bit-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }
  .bit-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    padding: 8px 4px 6px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.5;
  }
  .bit-btn .bit-name { display: block; color: var(--text); font-size: 0.65rem; font-weight: 700; }
  .bit-btn:hover { border-color: var(--accent2); }
  .bit-btn.active { background: rgba(255,60,95,0.12); border-color: var(--accent); color: var(--accent); }
  .bit-btn.active .bit-name { color: var(--accent); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 14px 0;
  }

  .btn {
    width: 100%;
    padding: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-weight: 700;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #ff5577; }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-ghost { background: none; color: var(--accent2); border: 1px solid var(--accent2); }
  .btn-ghost:hover { background: rgba(0,229,255,0.08); }
  .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

  .canvas-area { display: flex; flex-direction: column; gap: 0; }

  .canvas-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 520px;
    position: relative;
    overflow: hidden;
  }
  .canvas-wrap canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .empty-state { text-align: center; pointer-events: none; user-select: none; }
  .empty-state .big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 5rem;
    letter-spacing: 0.1em;
    color: var(--border);
    line-height: 1;
  }
  .empty-state p { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 10px; }

  .status-bar {
    background: #0d0d15;
    border: 1px solid var(--border);
    border-top: none;
    padding: 8px 16px;
    display: flex;
    gap: 24px;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    flex-wrap: wrap;
  }
  .status-bar .s-val { color: var(--accent2); margin-left: 6px; }

  .processing-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,10,15,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--accent2);
    text-transform: uppercase;
    display: none;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .erase-active #canvasWrap { cursor: crosshair; }
  .erase-active #canvasWrap canvas { outline: 2px solid var(--accent); outline-offset: -2px; }

  .checker-bg {
    background-image:
      linear-gradient(45deg, #1a1a26 25%, transparent 25%),
      linear-gradient(-45deg, #1a1a26 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1a26 75%),
      linear-gradient(-45deg, transparent 75%, #1a1a26 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #111118;
  }
</style>
</head>
<body>

<header>
  <h1>MOSAIC</h1>
  <span class="tag">v2.0</span>
</header>

<div class="workspace">
  <aside class="side">

    <div class="card">
      <div class="card-label">이미지 업로드</div>
      <div class="drop-zone" id="dropZone">
        <span class="icon">⬛</span>
        <p><strong>클릭</strong>하거나<br>드래그하여 이미지를<br>여기에 놓으세요</p>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="card">
      <div class="card-label">픽셀 설정</div>

      <div style="margin-bottom:14px;">
        <div class="card-label" style="margin-bottom:10px;">픽셀 크기</div>
        <div class="bit-grid" style="grid-template-columns:repeat(5,1fr);" id="pixelBtns">
          <button class="bit-btn" data-px="2"><span class="bit-name">2</span>px</button>
          <button class="bit-btn" data-px="4"><span class="bit-name">4</span>px</button>
          <button class="bit-btn active" data-px="8"><span class="bit-name">8</span>px</button>
          <button class="bit-btn" data-px="16"><span class="bit-name">16</span>px</button>
          <button class="bit-btn" data-px="32"><span class="bit-name">32</span>px</button>
        </div>
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <span>채도</span>
          <span class="slider-val" id="satVal">100%</span>
        </div>
        <input type="range" id="saturation" min="0" max="200" value="100" step="5">
      </div>
    </div>

    <div class="card">
      <div class="card-label">색상 비트 깊이</div>

      <!-- 비트 프리셋 -->
      <div class="bit-grid">
        <button class="bit-btn" data-colors="2">
          <span class="bit-name">1-bit</span>
          2색
        </button>
        <button class="bit-btn" data-colors="4">
          <span class="bit-name">2-bit</span>
          4색
        </button>
        <button class="bit-btn" data-colors="8">
          <span class="bit-name">3-bit</span>
          8색
        </button>
        <button class="bit-btn" data-colors="16">
          <span class="bit-name">4-bit</span>
          16색
        </button>
        <button class="bit-btn" data-colors="256">
          <span class="bit-name">8-bit</span>
          256색
        </button>
        <button class="bit-btn active" data-colors="65536">
          <span class="bit-name">16-bit</span>
          원본
        </button>
      </div>

      <div class="divider"></div>

      <!-- 커스텀 슬라이더 -->
      <div class="slider-row">
        <div class="slider-header">
          <span>커스텀 색상 수</span>
          <span class="slider-val" id="colorVal">—</span>
        </div>
        <input type="range" id="colorCount" min="2" max="256" value="256" step="1">
      </div>
    </div>

    <div class="card" id="eraseCard">
      <div class="card-label">색상 지우기</div>

      <div style="font-size:0.65rem;color:var(--muted);line-height:1.7;margin-bottom:14px;">
        캔버스를 <strong style="color:var(--accent2)">클릭</strong>하면 해당 색상과<br>연결된 영역을 삭제합니다.
      </div>

      <!-- 모드 토글 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;">
        <button class="erase-mode-btn active" id="modeFlood" data-mode="flood"
          style="background:none;border:1px solid var(--accent);color:var(--accent);font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.08em;padding:8px 4px;cursor:pointer;text-align:center;line-height:1.5;transition:all .15s;">
          <span style="display:block;font-size:0.7rem;font-weight:700;">FLOOD</span>연결된 영역만
        </button>
        <button class="erase-mode-btn" id="modeGlobal" data-mode="global"
          style="background:none;border:1px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.08em;padding:8px 4px;cursor:pointer;text-align:center;line-height:1.5;transition:all .15s;">
          <span style="display:block;font-size:0.7rem;font-weight:700;">GLOBAL</span>이미지 전체
        </button>
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <span>허용 오차</span>
          <span class="slider-val" id="toleranceVal">30</span>
        </div>
        <input type="range" id="toleranceSlider" min="0" max="150" value="30" step="1">
      </div>

      <div class="divider"></div>

      <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;">
        <div id="eraseColorPreview" style="width:28px;height:28px;border:1px solid var(--border);background:#888;flex-shrink:0;"></div>
        <div style="font-size:0.6rem;color:var(--muted);line-height:1.5;">
          마지막 클릭 색상<br>
          <span id="eraseColorHex" style="color:var(--accent2);letter-spacing:0.1em;">—</span>
        </div>
      </div>

      <button class="btn btn-ghost" id="undoEraseBtn" disabled style="margin-bottom:6px;">↩ 되돌리기</button>
      <button class="btn" id="eraseToggleBtn"
        style="background:rgba(255,60,95,0.15);color:var(--accent);border:1px solid var(--accent);font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;font-weight:700;padding:12px;cursor:pointer;">
        ✕ 지우기 모드 ON
      </button>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:10px;">
      <div class="card-label">내보내기</div>
      <button class="btn btn-ghost" id="downloadBtn" disabled>PNG 다운로드</button>
    </div>

  </aside>

  <div class="canvas-area">
    <div class="canvas-wrap checker-bg" id="canvasWrap">
      <div class="empty-state" id="emptyState">
        <div class="big">MOSAIC</div>
        <p>이미지를 업로드하면<br>픽셀화가 시작됩니다</p>
      </div>
      <canvas id="outputCanvas" style="display:none;"></canvas>
      <div class="processing-overlay" id="processingOverlay">
        <div class="spinner"></div>
        <span>양자화 처리 중...</span>
      </div>
    </div>
    <div class="status-bar">
      <span>원본<span class="s-val" id="sOrigSize">—</span></span>
      <span>픽셀 크기<span class="s-val" id="sBlock">—</span></span>
      <span>색상 수<span class="s-val" id="sColors">—</span></span>
      <span>실제 색상<span class="s-val" id="sActualColors">—</span></span>
    </div>
  </div>
</div>

<script>
  const dropZone   = document.getElementById('dropZone');
  const fileInput  = document.getElementById('fileInput');
  const colorSlider = document.getElementById('colorCount');
  const satSlider  = document.getElementById('saturation');
  const colorVal   = document.getElementById('colorVal');
  const satVal     = document.getElementById('satVal');
  let currentPixelSize = 8;
  const downloadBtn = document.getElementById('downloadBtn');
  const outputCanvas = document.getElementById('outputCanvas');
  const emptyState = document.getElementById('emptyState');
  const processingOverlay = document.getElementById('processingOverlay');
  const ctx = outputCanvas.getContext('2d');

  let originalImage = null;
  let targetColors = 65536; // default: 16-bit (no quantization)
  let renderTimer = null;

  // ── 파일 로드 ──────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        originalImage = img;
        document.getElementById('sOrigSize').textContent = `${img.width}×${img.height}`;
        scheduleRender();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── 슬라이더 이벤트 ────────────────────────────────
  document.querySelectorAll('#pixelBtns .bit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#pixelBtns .bit-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPixelSize = parseInt(btn.dataset.px);
      if (originalImage) scheduleRender();
    });
  });
  satSlider.addEventListener('input', () => {
    satVal.textContent = satSlider.value + '%';
    if (originalImage) scheduleRender();
  });
  colorSlider.addEventListener('input', () => {
    const v = parseInt(colorSlider.value);
    colorVal.textContent = v;
    targetColors = v;
    // 커스텀 선택시 비트 버튼 해제
    document.querySelectorAll('.bit-btn').forEach(b => b.classList.remove('active'));
    if (originalImage) scheduleRender();
  });

  // ── 비트 프리셋 버튼 ───────────────────────────────
  document.querySelectorAll('.bit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bit-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      targetColors = parseInt(btn.dataset.colors);
      // 슬라이더 sync (65536은 max 밖이니 256으로 표시만)
      const sliderVal = Math.min(targetColors, 256);
      colorSlider.value = sliderVal;
      colorVal.textContent = targetColors >= 65536 ? '제한 없음' : targetColors;
      if (originalImage) scheduleRender();
    });
  });

  // ── 디바운스 렌더 ──────────────────────────────────
  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => renderPixelated(), 80);
  }

  // ── 다운로드 ───────────────────────────────────────
  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'mosaic.png';
    link.href = outputCanvas.toDataURL('image/png');
    link.click();
  });

  // ══════════════════════════════════════════════════
  //  CORE: 픽셀화 + Median Cut 양자화
  // ══════════════════════════════════════════════════
  function renderPixelated() {
    if (!originalImage) return;

    const blockSize = currentPixelSize;
    const sat = parseInt(satSlider.value) / 100;
    const W = originalImage.width;
    const H = originalImage.height;
    const sw = Math.ceil(W / blockSize);
    const sh = Math.ceil(H / blockSize);

    // 1) 작은 캔버스에 그리기 (픽셀화)
    const small = document.createElement('canvas');
    small.width = sw; small.height = sh;
    const sc = small.getContext('2d');
    sc.drawImage(originalImage, 0, 0, sw, sh);
    const imageData = sc.getImageData(0, 0, sw, sh);
    const data = imageData.data;

    // 2) 채도 적용 + 반투명만 불투명화 (완전 투명은 유지)
    for (let i = 0; i < data.length; i += 4) {
      if (data[i+3] === 0) continue; // 완전 투명 픽셀은 건드리지 않음
      const r = data[i], g = data[i+1], b = data[i+2];
      const gray = 0.299*r + 0.587*g + 0.114*b;
      data[i]   = clamp(gray + sat * (r - gray));
      data[i+1] = clamp(gray + sat * (g - gray));
      data[i+2] = clamp(gray + sat * (b - gray));
      data[i+3] = 255; // 반투명 → 불투명
    }

    // 3) 색상 양자화 (Median Cut)
    const numColors = targetColors;
    let palette = null;

    if (numColors < 65536) {
      processingOverlay.style.display = 'flex';
      // setTimeout으로 UI 업데이트 후 무거운 작업 실행
      setTimeout(() => {
        palette = medianCut(data, Math.min(numColors, 256));
        applyPalette(data, palette);
        sc.putImageData(imageData, 0, 0);
        drawOutput(small, sw, sh, W, H, palette ? palette.length : '제한 없음');
        processingOverlay.style.display = 'none';
      }, 20);
    } else {
      sc.putImageData(imageData, 0, 0);
      drawOutput(small, sw, sh, W, H, '제한 없음');
    }
  }

  function drawOutput(small, sw, sh, W, H, colorCount) {
    // 출력 크기 = 픽셀화된 해상도 (sw×sh), 업스케일 없음
    outputCanvas.width = sw;
    outputCanvas.height = sh;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, sw, sh, 0, 0, sw, sh);

    // 미리보기: 컨테이너에 맞게 표시 크기 계산 (비율 유지, 픽셀 선명하게)
    const wrap = document.getElementById('canvasWrap');
    const maxW = wrap.clientWidth  - 32;
    const maxH = wrap.clientHeight - 32;
    const scale = Math.min(maxW / sw, maxH / sh);
    outputCanvas.style.width  = Math.round(sw * scale) + 'px';
    outputCanvas.style.height = Math.round(sh * scale) + 'px';

    emptyState.style.display = 'none';
    outputCanvas.style.display = 'block';
    downloadBtn.disabled = false;

    document.getElementById('sBlock').textContent = `${currentPixelSize}×${currentPixelSize}`;
    document.getElementById('sColors').textContent = colorCount;

    // 실제 사용 색상 수 세기
    const id = ctx.getImageData(0, 0, sw, sh);
    const colorSet = new Set();
    for (let i = 0; i < id.data.length; i += 4) {
      colorSet.add((id.data[i] << 16) | (id.data[i+1] << 8) | id.data[i+2]);
    }
    document.getElementById('sActualColors').textContent = colorSet.size.toLocaleString();
  }

  // ── 팔레트 적용 ────────────────────────────────────
  function applyPalette(data, palette) {
    for (let i = 0; i < data.length; i += 4) {
      const [nr, ng, nb] = nearestColor(data[i], data[i+1], data[i+2], palette);
      data[i] = nr; data[i+1] = ng; data[i+2] = nb;
    }
  }

  function nearestColor(r, g, b, palette) {
    let best = palette[0], bestDist = Infinity;
    for (const c of palette) {
      const d = (r-c[0])**2 + (g-c[1])**2 + (b-c[2])**2;
      if (d < bestDist) { bestDist = d; best = c; }
    }
    return best;
  }

  // ══════════════════════════════════════════════════
  //  Median Cut Color Quantization
  // ══════════════════════════════════════════════════
  function medianCut(data, maxColors) {
    // 픽셀 배열 수집 (샘플링: 너무 많으면 느려서 최대 8000픽셀)
    const pixels = [];
    const step = Math.max(1, Math.floor(data.length / 4 / 8000));
    for (let i = 0; i < data.length; i += 4 * step) {
      pixels.push([data[i], data[i+1], data[i+2]]);
    }

    // 재귀 분할
    const buckets = [pixels];
    while (buckets.length < maxColors) {
      // 범위가 가장 큰 버킷 찾기
      let maxRange = -1, splitIdx = -1;
      for (let i = 0; i < buckets.length; i++) {
        const range = colorRange(buckets[i]);
        if (range > maxRange) { maxRange = range; splitIdx = i; }
      }
      if (maxRange === 0) break;

      const bucket = buckets.splice(splitIdx, 1)[0];
      const [b1, b2] = splitBucket(bucket);
      buckets.push(b1, b2);
    }

    // 각 버킷의 평균색 = 팔레트
    return buckets.map(bucket => {
      let r=0, g=0, b=0;
      for (const p of bucket) { r+=p[0]; g+=p[1]; b+=p[2]; }
      const n = bucket.length;
      return [Math.round(r/n), Math.round(g/n), Math.round(b/n)];
    });
  }

  function colorRange(bucket) {
    let minR=255,maxR=0, minG=255,maxG=0, minB=255,maxB=0;
    for (const [r,g,b] of bucket) {
      if(r<minR)minR=r; if(r>maxR)maxR=r;
      if(g<minG)minG=g; if(g>maxG)maxG=g;
      if(b<minB)minB=b; if(b>maxB)maxB=b;
    }
    return Math.max(maxR-minR, maxG-minG, maxB-minB);
  }

  function splitBucket(bucket) {
    // 범위가 가장 큰 채널로 정렬해서 중앙 분할
    let minR=255,maxR=0, minG=255,maxG=0, minB=255,maxB=0;
    for (const [r,g,b] of bucket) {
      if(r<minR)minR=r; if(r>maxR)maxR=r;
      if(g<minG)minG=g; if(g>maxG)maxG=g;
      if(b<minB)minB=b; if(b>maxB)maxB=b;
    }
    const rRange=maxR-minR, gRange=maxG-minG, bRange=maxB-minB;
    const ch = rRange>=gRange && rRange>=bRange ? 0 : gRange>=bRange ? 1 : 2;

    bucket.sort((a,b) => a[ch]-b[ch]);
    const mid = Math.floor(bucket.length / 2);
    return [bucket.slice(0, mid), bucket.slice(mid)];
  }

  function clamp(v) { return Math.max(0, Math.min(255, Math.round(v))); }

  // ══════════════════════════════════════════════════
  //  색상 지우기 (Flood Fill / Global)
  // ══════════════════════════════════════════════════
  let eraseMode = false;
  let eraseType = 'flood'; // 'flood' | 'global'
  let eraseHistory = []; // ImageData 스냅샷 스택

  const eraseToggleBtn = document.getElementById('eraseToggleBtn');
  const undoEraseBtn   = document.getElementById('undoEraseBtn');
  const toleranceSlider = document.getElementById('toleranceSlider');
  const toleranceVal   = document.getElementById('toleranceVal');
  const eraseColorPreview = document.getElementById('eraseColorPreview');
  const eraseColorHex  = document.getElementById('eraseColorHex');

  toleranceSlider.addEventListener('input', () => {
    toleranceVal.textContent = toleranceSlider.value;
  });

  // 모드 버튼 전환
  document.querySelectorAll('.erase-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      eraseType = btn.dataset.mode;
      document.querySelectorAll('.erase-mode-btn').forEach(b => {
        const isActive = b.dataset.mode === eraseType;
        b.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';
        b.style.color = isActive ? 'var(--accent)' : 'var(--muted)';
        b.style.background = isActive ? 'rgba(255,60,95,0.1)' : 'none';
        b.querySelector('span').style.color = isActive ? 'var(--accent)' : 'var(--text)';
      });
    });
  });

  // 지우기 모드 ON/OFF
  eraseToggleBtn.addEventListener('click', () => {
    eraseMode = !eraseMode;
    document.body.classList.toggle('erase-active', eraseMode);
    eraseToggleBtn.textContent = eraseMode ? '✕ 지우기 모드 OFF' : '✕ 지우기 모드 ON';
    eraseToggleBtn.style.background = eraseMode ? 'rgba(255,60,95,0.35)' : 'rgba(255,60,95,0.15)';
  });

  // 되돌리기
  undoEraseBtn.addEventListener('click', () => {
    if (eraseHistory.length === 0) return;
    const snap = eraseHistory.pop();
    ctx.putImageData(snap, 0, 0);
    undoEraseBtn.disabled = eraseHistory.length === 0;
  });

  // 캔버스 클릭 → 지우기
  outputCanvas.addEventListener('click', e => {
    if (!eraseMode) return;

    // 캔버스 내 실제 픽셀 좌표 계산
    const rect = outputCanvas.getBoundingClientRect();
    const scaleX = outputCanvas.width  / rect.width;
    const scaleY = outputCanvas.height / rect.height;
    const px = Math.floor((e.clientX - rect.left)  * scaleX);
    const py = Math.floor((e.clientY - rect.top)   * scaleY);

    if (px < 0 || py < 0 || px >= outputCanvas.width || py >= outputCanvas.height) return;

    // 스냅샷 저장
    eraseHistory.push(ctx.getImageData(0, 0, outputCanvas.width, outputCanvas.height));
    if (eraseHistory.length > 30) eraseHistory.shift();
    undoEraseBtn.disabled = false;

    const imageData = ctx.getImageData(0, 0, outputCanvas.width, outputCanvas.height);
    const data = imageData.data;
    const tol  = parseInt(toleranceSlider.value);
    const idx  = (py * outputCanvas.width + px) * 4;
    const tr = data[idx], tg = data[idx+1], tb = data[idx+2];

    // UI 미리보기 갱신
    const hex = '#' + [tr,tg,tb].map(v=>v.toString(16).padStart(2,'0')).join('');
    eraseColorPreview.style.background = hex;
    eraseColorHex.textContent = hex.toUpperCase();

    if (eraseType === 'global') {
      eraseGlobal(data, tr, tg, tb, tol);
    } else {
      eraseFlood(data, outputCanvas.width, outputCanvas.height, px, py, tr, tg, tb, tol);
    }

    ctx.putImageData(imageData, 0, 0);
  });

  function colorDist(r,g,b, tr,tg,tb) {
    return Math.sqrt((r-tr)**2 + (g-tg)**2 + (b-tb)**2);
  }

  // 이미지 전체에서 유사 색상 픽셀 삭제
  function eraseGlobal(data, tr, tg, tb, tol) {
    for (let i = 0; i < data.length; i += 4) {
      if (data[i+3] === 0) continue;
      if (colorDist(data[i],data[i+1],data[i+2], tr,tg,tb) <= tol) {
        data[i+3] = 0;
      }
    }
  }

  // Flood Fill: 클릭 지점과 연결된 유사색 픽셀만 삭제 (BFS, 4-연결)
  function eraseFlood(data, w, h, sx, sy, tr, tg, tb, tol) {
    const visited = new Uint8Array(w * h);
    const queue = [[sx, sy]];
    visited[sy * w + sx] = 1;

    while (queue.length > 0) {
      const [x, y] = queue.shift();
      const i = (y * w + x) * 4;
      if (data[i+3] === 0) continue; // 이미 투명
      if (colorDist(data[i],data[i+1],data[i+2], tr,tg,tb) > tol) continue;

      data[i+3] = 0; // 투명 처리

      const neighbors = [[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
      for (const [nx, ny] of neighbors) {
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const ni = ny * w + nx;
        if (visited[ni]) continue;
        visited[ni] = 1;
        const di = ni * 4;
        if (data[di+3] === 0) continue;
        if (colorDist(data[di],data[di+1],data[di+2], tr,tg,tb) <= tol) {
          queue.push([nx, ny]);
        }
      }
    }
  }
</script>
